[workspace]
resolver = "3"
members = [
    "crates/infinity-steel-core",
    "crates/infinity-runtime",
    "crates/infinity-updater",
    "crates/infinity-helper",
    "crates/infinity-pkg",
    "crates/infinity-gui",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
infinity-steel-core = { path = "crates/infinity-steel-core" }
infinity-runtime = { path = "crates/infinity-runtime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
ed25519-dalek = "3.0.0"
tar = "0.4.46"
xz2 = "0.1.7"
tempfile = "3.27.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
